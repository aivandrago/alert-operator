---
# Source: alert-operator/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ao-alert-operator
  namespace: observability
  labels:
    helm.sh/chart: alert-operator-0.1.0
    app.kubernetes.io/name: alert-operator
    app.kubernetes.io/instance: ao
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: alert-operator
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-operator
      app.kubernetes.io/instance: ao
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-operator
        app.kubernetes.io/instance: ao
    spec:
      serviceAccountName: ao-alert-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: "ghcr.io/aivandrago/alert-operator:0.1.0"
          imagePullPolicy: IfNotPresent
          args:
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8443
            - --metrics-secure=true
            - --leader-elect
            - --zap-log-level=info
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 8443
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: alert-operator
                    app.kubernetes.io/instance: ao

---
# Source: alert-operator/templates/alertrule-protection.yaml
# Only the operator writes AlertRule objects (docs/design.md §4.2); the same policy as
# config/policy, with this release's service account.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ao-alert-operator-alertrules
  labels:
    helm.sh/chart: alert-operator-0.1.0
    app.kubernetes.io/name: alert-operator
    app.kubernetes.io/instance: ao
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: alert-operator
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["alerts.hypersurgery.dev"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["alertrules", "alertrules/status"]
  variables:
    - name: writers
      expression: >-
        [
          'system:serviceaccount:observability:ao-alert-operator',
          'system:serviceaccount:kube-system:generic-garbage-collector',
          'system:serviceaccount:kube-system:namespace-controller'
        ]
  validations:
    - expression: request.userInfo.username in variables.writers
      messageExpression: >-
        'AlertRule objects are written by alert-operator only; ' + request.userInfo.username +
        ' may read them. Change the PrometheusRule the rule comes from instead.'
      reason: Forbidden

