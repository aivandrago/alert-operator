apiVersion: v2
name: alert-operator
description: Kubernetes operator that keeps a read-only inventory of your Prometheus alert rules with an owner and a quality verdict for each
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.30.0-0"
keywords:
  - prometheus
  - alertmanager
  - alerting
  - prometheus-operator
  - inventory
  - observability
home: https://hypersurgery.dev/alert-operator/
sources:
  - https://github.com/aivandrago/alert-operator
maintainers:
  - name: Ivan Drago
    email: feverondiva@proton.me
    url: https://github.com/aivandrago
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "true"
  artifacthub.io/operatorCapabilities: Basic Install
  artifacthub.io/category: monitoring-logging
  artifacthub.io/prerelease: "true"
  artifacthub.io/images: |
    - name: alert-operator
      image: ghcr.io/aivandrago/alert-operator:0.1.0
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/aivandrago/alert-operator/blob/main/docs/install.md
    - name: Source
      url: https://github.com/aivandrago/alert-operator
    - name: support
      url: https://github.com/aivandrago/alert-operator/issues
  artifacthub.io/changes: |
    - kind: added
      description: AlertScope and AlertRule (alerts.hypersurgery.dev/v1alpha1), a read-only inventory of Prometheus alerting rules with one AlertRule per rule in the rule's namespace
    - kind: added
      description: Findings NotLoaded (with the selector to blame), LoadError, DeadQuery, Noisy, Flapping, AlwaysSilenced, NeverFired, Unowned, NoRunbook and NoSeverity
    - kind: added
      description: hs_alert_* metrics, Events when a rule gains or loses a finding, an Alert quality Grafana dashboard and the operator's own alerts
    - kind: added
      description: A ValidatingAdmissionPolicy that lets only the operator write AlertRule objects, and RBAC that cannot write to anything the operator does not own
  artifacthub.io/crdsExamples: |
    - apiVersion: alerts.hypersurgery.dev/v1alpha1
      kind: AlertScope
      metadata:
        name: main
      spec:
        prometheus:
          url: http://prometheus-operated.monitoring.svc:9090
          resourceRef: { namespace: monitoring, name: k8s }
        alertmanager:
          url: http://alertmanager-operated.monitoring.svc:9093
  artifacthub.io/crds: |
    - kind: AlertScope
      version: v1alpha1
      name: alertscopes.alerts.hypersurgery.dev
      description: Where to read alert rules from and how to judge them
    - kind: AlertRule
      version: v1alpha1
      name: alertrules.alerts.hypersurgery.dev
      description: Read-only mirror of one alerting rule with its owner and quality verdict
