    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AlertSilence is an Alertmanager silence declared as code: matchers, an owner, a reason and a
          mandatory end, limited to the namespace's own alerts. The operator creates the silence, keeps
          it in step and expires it when the object is deleted (docs/silences.md).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the silence asked for
            properties:
              dryRun:
                description: |-
                  dryRun only proposes: the status shows the silence and the alerts it would match, and
                  nothing is written to Alertmanager.
                type: boolean
              duration:
                description: |-
                  duration is how long the silence lasts from its start. Between 1m and 90d; the scope's
                  silences.maxDuration may allow less.
                maxLength: 7
                pattern: ^[0-9]{1,6}(s|m|h|d)$
                type: string
                x-kubernetes-validations:
                - message: duration must be at least 1m
                  rule: 'int(self.substring(0, size(self)-1)) * {''s'': 1, ''m'':
                    60, ''h'': 3600, ''d'': 86400}[self.substring(size(self)-1)] >=
                    60'
                - message: duration must be at most 90d
                  rule: 'int(self.substring(0, size(self)-1)) * {''s'': 1, ''m'':
                    60, ''h'': 3600, ''d'': 86400}[self.substring(size(self)-1)] <=
                    7776000'
              expiresAt:
                description: expiresAt is when the silence ends.
                format: date-time
                type: string
              matchers:
                description: matchers select the alerts to silence.
                items:
                  description: SilenceMatcher is one matcher of a silence, as in Alertmanager.
                  properties:
                    isEqual:
                      default: true
                      description: 'isEqual: false negates the matcher (!= or !~).'
                      type: boolean
                    isRegex:
                      description: 'isRegex: value is a regular expression (anchored,
                        as in Alertmanager).'
                      type: boolean
                    name:
                      description: name of the label.
                      maxLength: 128
                      minLength: 1
                      type: string
                    value:
                      description: value to match; a regular expression with isRegex.
                      maxLength: 1024
                      type: string
                  required:
                  - name
                  - value
                  type: object
                maxItems: 16
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
              owner:
                description: owner is the team the silence is for.
                maxLength: 63
                minLength: 1
                type: string
              reason:
                description: reason says why, for whoever finds the silence later.
                maxLength: 1024
                minLength: 10
                type: string
              scopeRef:
                description: |-
                  scopeRef names the AlertScope whose Alertmanager gets the silence and whose policy
                  applies.
                maxLength: 253
                minLength: 1
                type: string
              startsAt:
                description: 'startsAt is when the silence begins; default: when the
                  object is created.'
                format: date-time
                type: string
            required:
            - matchers
            - owner
            - reason
            - scopeRef
            type: object
            x-kubernetes-validations:
            - message: exactly one of expiresAt and duration must be set
              rule: has(self.expiresAt) != has(self.duration)
          status:
