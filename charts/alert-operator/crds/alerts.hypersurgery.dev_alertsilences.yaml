                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endsAt:
                format: date-time
                type: string
              matchedAlerts:
                description: matchedAlerts is how many alerts Alertmanager currently
                  has that the matchers match.
                format: int32
                type: integer
              message:
                description: message explains the state, in particular why an object
                  was rejected.
                type: string
              observedGeneration:
                description: observedGeneration is the generation the status describes.
                format: int64
                type: integer
              proposed:
                description: proposed is the silence, as the operator would write
                  it.
                properties:
                  comment:
                    type: string
                  createdBy:
                    type: string
                  endsAt:
                    format: date-time
                    type: string
                  matchers:
                    items:
                      description: SilenceMatcher is one matcher of a silence, as
                        in Alertmanager.
                      properties:
                        isEqual:
                          default: true
                          description: 'isEqual: false negates the matcher (!= or
                            !~).'
                          type: boolean
                        isRegex:
                          description: 'isRegex: value is a regular expression (anchored,
                            as in Alertmanager).'
                          type: boolean
                        name:
                          description: name of the label.
                          maxLength: 128
                          minLength: 1
                          type: string
                        value:
                          description: value to match; a regular expression with isRegex.
                          maxLength: 1024
                          type: string
                      required:
                      - name
                      - value
                      type: object
                    type: array
                  startsAt:
                    format: date-time
                    type: string
                required:
                - comment
                - createdBy
                - endsAt
                - matchers
                - startsAt
                type: object
              silenceID:
                description: silenceID is the silence's ID in Alertmanager.
                type: string
              specHash:
                description: specHash identifies the spec the silence was written
                  for.
                type: string
              startsAt:
                description: startsAt and endsAt of the silence.
                format: date-time
                type: string
              state:
                description: state of the silence.
                enum:
                - Disabled
                - Proposed
                - Rejected
                - Pending
                - Active
                - Expired
                - ExpiredExternally
                type: string
            type: object
        required:
