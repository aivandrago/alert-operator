---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: alertrules.alerts.hypersurgery.dev
spec:
  group: alerts.hypersurgery.dev
  names:
    categories:
    - hypersurgery
    kind: AlertRule
    listKind: AlertRuleList
    plural: alertrules
    shortNames:
    - hsar
    singular: alertrule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.source.alert
      name: Alert
      type: string
    - jsonPath: .status.team
      name: Team
      type: string
    - jsonPath: .status.loaded
      name: Loaded
      type: boolean
    - jsonPath: .status.quality.activations
      name: Fired
      type: integer
    - jsonPath: .status.quality.lastFired
      name: Last Fired
      type: date
    - jsonPath: .status.findingsSummary
      name: Findings
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AlertRule is a read-only mirror of one alerting rule with its owner and quality verdict.
          The operator creates, updates and deletes these objects; nobody else writes them.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is a copy of the rule
            properties:
              annotations:
                additionalProperties:
                  type: string
                description: annotations of the rule.
                type: object
              expr:
                description: expr is the PromQL expression.
                type: string
              for:
                description: for is how long the expression must hold before the alert
                  fires.
                type: string
              keepFiringFor:
                description: keepFiringFor is how long the alert keeps firing after
                  the expression stops holding.
                type: string
              labels:
                additionalProperties:
                  type: string
                description: labels of the rule.
                type: object
              scopeRef:
                description: scopeRef is the name of the AlertScope this rule was
                  found in.
                type: string
              source:
                description: source says where the rule is defined.
                properties:
                  alert:
                    description: alert is the alert name.
                    type: string
                  file:
                    description: file Prometheus loaded the rule from, as the rules
                      API reports it.
                    type: string
                  group:
                    description: group is the rule group's name.
                    type: string
                  kind:
                    description: 'kind: PrometheusRule, or File for a rule Prometheus
                      loaded from a plain rule file.'
                    enum:
                    - PrometheusRule
                    - File
                    type: string
                  name:
                    description: name of the PrometheusRule.
                    type: string
                  namespace:
                    description: namespace of the PrometheusRule.
                    type: string
                required:
                - alert
                - group
                - kind
                type: object
            required:
            - expr
            - scopeRef
            - source
            type: object
          status:
            description: status is the verdict
            properties:
              conditions:
                description: 'conditions: Healthy (False with the most severe finding
                  as reason).'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              findings:
                description: findings on the rule, most severe first.
                items:
                  description: Finding is one problem with the rule.
                  properties:
                    message:
                      description: message explains the finding in one sentence.
                      type: string
                    severity:
                      description: severity of the finding.
                      enum:
                      - critical
                      - warning
                      - info
                      type: string
                    type:
                      description: type of the finding.
                      enum:
                      - NotLoaded
                      - LoadError
                      - DeadQuery
                      - NeverFired
                      - Noisy
                      - Flapping
                      - AlwaysSilenced
                      - Unowned
                      - NoRunbook
                      - NoSeverity
                      type: string
                  required:
                  - message
                  - severity
                  - type
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              findingsSummary:
                description: findingsSummary lists the finding types, comma-separated,
                  for kubectl get.
                type: string
              firstSeen:
                description: firstSeen is when the operator first found the rule.
                format: date-time
                type: string
              identity:
                description: |-
                  identity is the rule's stable id: scope, source, group and alert name. It survives
                  edits of the expression, duration and labels.
                type: string
              lastEvaluated:
                description: |-
                  lastEvaluated is when the quality was last measured. It stops moving while Prometheus
                  cannot be read: the verdict is then stale.
                format: date-time
                type: string
              loaded:
                description: 'loaded: Prometheus has loaded the rule.'
                type: boolean
              notLoadedReason:
                description: notLoadedReason explains why a defined rule is not loaded,
                  when it is known.
                type: string
              quality:
                description: quality is the rule's measured behaviour.
                properties:
                  activations:
                    description: 'activations: how many times the alert started firing
                      (or pending) in the window.'
                    format: int32
                    type: integer
                  activationsPerDay:
                    description: 'activationsPerDay: activations divided by the window
                      in days.'
                    type: number
                  firingFraction:
                    description: 'firingFraction: the share of the window the alert
                      was firing.'
                    type: number
                  lastFired:
                    description: 'lastFired: the last time the alert was seen firing.'
                    format: date-time
                    type: string
                  medianFiringDuration:
                    description: 'medianFiringDuration: the median time one activation
                      stayed firing.'
                    maxLength: 7
                    pattern: ^[0-9]{1,6}(s|m|h|d)$
                    type: string
                  silencedFraction:
                    description: 'silencedFraction: the share of the firing time covered
                      by a matching silence.'
                    type: number
                type: object
              team:
                description: team owning the rule; "<none>" when no source names one.
                type: string
              window:
                description: window of history the quality was measured over.
                maxLength: 7
                pattern: ^[0-9]{1,6}(s|m|h|d)$
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
