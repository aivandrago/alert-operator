  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - alerts.hypersurgery.dev
  resources:
  - alertrules
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - alerts.hypersurgery.dev
  resources:
  - alertrules/status
  - alertscopes/status
