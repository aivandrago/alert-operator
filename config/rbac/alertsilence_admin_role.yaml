# This rule is not used by the project alert-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over alerts.hypersurgery.dev.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: alert-operator
    app.kubernetes.io/managed-by: kustomize
  name: alertsilence-admin-role
rules:
- apiGroups:
  - alerts.hypersurgery.dev
  resources:
  - alertsilences
  verbs:
  - '*'
- apiGroups:
  - alerts.hypersurgery.dev
  resources:
  - alertsilences/status
  verbs:
  - get
